"""Template of a script running a population."""

from mpi4py import MPI
from posydon.popsyn.binarypopulation import BinaryPopulation
from posydon.binary_evol import SimulationProperties
from posydon.binary_evol.flow_chart import flow_chart
from posydon.binary_evol.MESA.step_mesa import CO_HeMS_step, MS_MS_step, CO_HMS_RLO_step
from posydon.binary_evol.DT.step_detached import detached_step
from posydon.binary_evol.CE.step_CEE import StepCEE
from posydon.binary_evol.SN.step_SN import StepSN
from posydon.binary_evol.DT.double_CO import DoubleCO
from posydon.binary_evol.step_end import step_end
from posydon.binary_evol.simulationproperties import TimingHooks, StepNamesHooks
from collections import Counter
import time




# DO NOT CHANGE THIS BLOCK: parameters changed automatically ##################
OUTPUT_PATH = "/projects/b1119/dmu4160/NS_ULX/XLF_populations/Pop_4/xlf_submissions/simulations/015_kM-1_ccP_a1.0_l0.30_oPER/xlf015.h5"
CE_ALPHA = 1.0
CE_LAMBDA = 0.30
KICK_NORMALIZATION = 'one_over_mass'
CC_MECHANISM = 'Patton&Sukhbold20-engine'
CIRCULARIZE_AT_SAME_AM = False
###############################################################################


interp_method = 'linear3c_kNN'
stop_method = 'stop_at_max_time'

sim_kwargs = dict(
    flow=flow_chart(),
    step_HMS_HMS=(MS_MS_step, dict(interpolation_method=interp_method,
                                   stop_method=stop_method)),
    step_CO_HeMS=(CO_HeMS_step, dict(interpolation_method=interp_method,
                                     stop_method=stop_method)),
    step_CO_HMS_RLO=(CO_HMS_RLO_step, dict(interpolation_method=interp_method,
                                           stop_method=stop_method)),
    step_detached=(detached_step, 
                   {"RLO_orbit_at_orbit_with_same_am": CIRCULARIZE_AT_SAME_AM}),
    step_CE=(StepCEE, dict(common_envelope_option_for_HG_star='pessimistic',
                           common_envelope_efficiency=CE_ALPHA,
                           core_definition_H_fraction=CE_LAMBDA,
                           # TODO: core_definition_He_fraction ???
                           )),
    step_SN=(StepSN, {"use_interp_values": False,
                      "use_profiles": True,
                      "use_core_masses": True,
                      "mechanism": CC_MECHANISM,
                      "kick_normalisation": KICK_NORMALIZATION,
                      "sigma_kick_CCSN_NS": 265.0,
                      "sigma_kick_CCSN_BH": 265.0}),
    step_dco=(DoubleCO, {}),
    step_end=(step_end, {}),
    extra_hooks=[(TimingHooks, {}), (StepNamesHooks, {})],
)

kwargs = {
    'number_of_binaries': 10_000_000,
    'orbital_scheme': 'period',
    'orbital_period_scheme': 'Sana+12_period_extended',
    'eccentricity_scheme': 'zero',
    'extra_columns': ['step_times', 'step_names'],
    'only_select_columns': [
        'state', 'event', 'time',
        'separation', 'orbital_period', 'eccentricity',
        'lg_mtransfer_rate', 'rl_relative_overflow_1', 'rl_relative_overflow_2'
        ],
    # 'selection_function' : lambda binary: not(binary in pop.find_failed()),
    'include_S1': True,
    'S1_kwargs': {
        'only_select_columns': ['state', 'mass', 'log_L', 'log_R',
                                'surface_h1', 'center_h1', 'center_he4', 'co_core_mass',
                                'lg_mdot', 'lg_wind_mdot', 
                               'surf_avg_omega_div_omega_crit'],
        'scalar_names': ['natal_kick_array', 'f_fb', 'SN_type']
        },
    'include_S2': True,
    'S2_kwargs': {
        'only_select_columns': ['state', 'mass', 'log_L', 'log_R',
                                'surface_h1','center_h1', 'center_he4', 'co_core_mass',
                                'lg_mdot', 'lg_wind_mdot',
                               'surf_avg_omega_div_omega_crit'],
        'scalar_names': ['natal_kick_array', 'f_fb', 'SN_type']
           },
    'star_formation': 'constant',        # or `burst`
    'max_simulation_time': 100.0e6,      # i.e. 100 Myr
    }


# RUN THE POPULATION ##########################################################

comm = MPI.COMM_WORLD
rank = comm.Get_rank()
size = comm.Get_size()
sim_prop = SimulationProperties(**sim_kwargs)
pop = BinaryPopulation(population_properties=sim_prop, comm=comm, **kwargs)

original_start_time = time.time()
sim_prop.load_steps()
steps_load_time = (time.time()-original_start_time) / 60.0
if rank == 0:
    print(f'Rank {rank} loaded all steps in t={steps_load_time:.3g} min')

start_time = time.time()
pop.evolve() #check breakdown_to_df
evol_time = time.time() - start_time
n_bin = len(pop.manager.history_dfs)
if rank == 0:
    print(f'Rank {rank} evolved {n_bin} binaries in t={evol_time:.3g} min')

pop.save(OUTPUT_PATH, **kwargs)
total_time = time.time() - original_start_time
if rank == 0:
    print(f'Rank: {rank} | Run time: {total_time:.3g} min')